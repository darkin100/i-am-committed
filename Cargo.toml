[package]
name = "iamcommitted"
version = "1.0.0"
edition = "2021"
description = "A command line application that generates Git commit messages based on the Git diff."
authors = ["Glyn Darkin"]

[dependencies]
fern = "0.7.1"
log = "0.4"
clap = { version = "4.5.49", features = ["derive"] }
colored = "3.0.0"
openai-api-rs = "7.0.0"
tokio = "1.48.0"
termion = "*"
regex = "1.12.2"
once_cell = "1.19"
tempfile = "3.8"
chrono = "0.4"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
opentelemetry-stdout = { version = "0.31.0", features = ["trace"] }

[dev-dependencies]
serial_test = "3.0"
